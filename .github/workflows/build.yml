name: Build Pure

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gperf libssl-dev make libncurses5-dev libelf-dev python3-dev python3-setuptools python3-pip python-is-python3 rsync unzip zlib1g-dev file wget gettext ocaml-nox ocamlbuild sharutils uuid-dev liblz4-tool libgmp3-dev libmpfr-dev libmpc-dev libzstd-dev

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_thunder_timecloud=y
          CONFIG_LUCI=y
          EOF
          make defconfig

      - name: Download
        run: make download -j$(nproc)

      - name: Build
        run: make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-pure
          path: bin/targets/ramips/mt7621/*.bin
